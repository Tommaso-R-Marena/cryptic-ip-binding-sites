name: Rerank

# docs/RERANK_PLAN.md (+ amendment 1): re-dock the redocking primary set with
# Vina (seeds 1-3, up to 40 poses), score every pose with a screened Coulomb
# term, and test whether cross-fitted re-ranking recovers crystal poses more
# often than Vina's own ranking.
#
#   dock     30 shards: pose lists with Vina score, RMSD and E_el per pose
#   report   F1-F4; printed between markers
#
# The report code (scripts/rerank_report.py, cryptic_ip/rescoring/crossfit.py)
# is deliberately not a trigger: a report-only fix is dispatched with dock_run,
# which reuses that run's pose lists instead of docking again.

on:
  push:
    # Analyses, not tests: on main they run on demand only.
    branches-ignore:
      - main
    paths:
      - 'docs/RERANK_PLAN.md'
      - 'docs/RERANK_PLAN_AMENDMENT_1.md'
      - 'scripts/rerank.py'
      - 'cryptic_ip/rescoring/electrostatics.py'
      - '.github/workflows/rerank.yml'
  workflow_dispatch:
    inputs:
      census_run:
        description: 'redocking run holding the redocking-census and redocking-inputs artifacts'
        default: '36020459246'
      dock_run:
        description: 'reuse the pose lists of this rerank run (empty = dock)'
        default: ''

concurrency:
  group: rerank-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CENSUS_RUN: ${{ inputs.census_run || '36020459246' }}
  PY_DOCKING: 'rdkit==2026.3.6 vina==1.2.7 meeko==0.8.0 gemmi==0.7.5 pdb2pqr==3.6.1 propka==3.5.1'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      dock: ${{ steps.plan.outputs.dock }}
    steps:
      - id: plan
        run: echo "dock=$(python3 -c 'import json; print(json.dumps(list(range(30))))')" >> "$GITHUB_OUTPUT"

  dock:
    name: Dock ${{ matrix.shard }}
    needs: plan
    if: ${{ !inputs.dock_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.dock) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt $PY_DOCKING
          python -m pip install -e .
          which pdb2pqr
      - name: Census and inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$CENSUS_RUN" --repo "$GITHUB_REPOSITORY" --name redocking-census --dir census
          gh run download "$CENSUS_RUN" --repo "$GITHUB_REPOSITORY" --name redocking-inputs --dir bench
      - name: Restore structures
        uses: actions/cache/restore@v5
        with:
          path: data/redock/structures
          key: redock-structures-${{ hashFiles('bench/table_ids.txt') }}
      - name: Fetch anything the cache lacks
        run: python scripts/fetch_structures.py rcsb --out data/redock/structures --ids-file bench/table_ids.txt
      - name: Dock
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python scripts/rerank.py dock --census census/census.csv --structures-dir data/redock/structures \
            --ccd-dir census/ccd --shard-index ${{ matrix.shard }} --shard-count 30 --out-dir arms
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rerank-arms-${{ matrix.shard }}
          path: arms
          retention-days: 90

  report:
    name: Report
    needs: dock
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Census, pose lists and the redocking primary arm
        env:
          GH_TOKEN: ${{ github.token }}
          DOCK_RUN: ${{ inputs.dock_run || github.run_id }}
        run: |
          gh run download "$CENSUS_RUN" --repo "$GITHUB_REPOSITORY" --name redocking-census --dir census
          gh run download "$DOCK_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'rerank-arms-*' --dir arms
          gh run download "$CENSUS_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'redocking-arms-primary-*' \
            --dir primary || echo "redocking primary arm not available: reproducibility check skipped"
      - name: Report
        run: |
          python scripts/rerank_report.py --census census/census.csv --arms-dir arms \
            $( [ -d primary ] && echo --primary-dir primary ) --out-dir results/rerank
          cat results/rerank/RERANK.md >> "$GITHUB_STEP_SUMMARY"
          python scripts/extract_log_block.py emit RERANK_JSON results/rerank/rerank.json
          python scripts/extract_log_block.py emit RERANK_MD_B64 results/rerank/RERANK.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rerank-report
          path: results/rerank
          retention-days: 90
