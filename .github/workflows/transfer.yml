name: Transfer

# docs/TRANSFER_PLAN.md: the benchmark's machinery, unchanged, on a pre-registered
# dataset of buried phosphate-dense ligand sites (no inositol phosphates), then
# T1/T2 decided with a ten-permutation control and T3 - a transfer-trained model
# scored on the inositol phosphate benchmark's table - reported descriptively.
#
#   dataset    class ligands by formula rule, 1,200 sampled X-ray entries, and
#              homology groups computed jointly with the inositol benchmark's
#              entries (run 35949588200), so one namespace covers both
#   extract    60 shards; pockets labelled on the class ligands (--comp-ids)
#   prepare    the benchmark's table builder
#   evaluate   the benchmark's runs, plus ten permutations for T1/T2's tasks
#   compare    the benchmark's comparison (permutation r0 only, as there)
#   null       the ten-permutation control
#   decide     T1/T2 under the plan's control; T3 external test

on:
  push:
    paths:
      - 'docs/TRANSFER_PLAN.md'
      - 'scripts/build_polyanion_dataset.py'
      - 'scripts/transfer.py'
      - 'cryptic_ip/database/polyanion_ligands.py'
      - '.github/workflows/transfer.yml'
  workflow_dispatch:

concurrency:
  group: transfer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  IP_BENCHMARK_RUN: '35949588200'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - id: plan
        shell: python
        run: |
          import json, os
          runs = []
          for task in ["ip_site", "cryptic_ip_site", "burial"]:
              for arm in ["full", "no_hull_depth"]:
                  for r in [0, 1, 2]:
                      runs.append({"task": task, "arm": arm, "grouping": "sequence", "repeat": r,
                                   "holdout": r == 0, "permute": False})
                  runs.append({"task": task, "arm": arm, "grouping": "strict", "repeat": 0,
                               "holdout": False, "permute": False})
              for r in range(1 if task == "ip_site" else 10):
                  runs.append({"task": task, "arm": "full", "grouping": "sequence", "repeat": r,
                               "holdout": False, "permute": True})
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"shards={json.dumps(list(range(60)))}\n")
              fh.write(f"runs={json.dumps({'include': runs})}\n")
          print(len(runs), "runs")

  dataset:
    name: Dataset and joint homology groups
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          run-post: 'false'
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,bioconda

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge -c bioconda mmseqs2 foldseek pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Build the transfer entry table
        shell: bash -l {0}
        run: |
          python scripts/build_polyanion_dataset.py --entry-csv data/transfer/entries.csv \
            --comp-ids-out data/transfer/comp_ids.txt --manifest data/transfer/manifest.json
          cat data/transfer/comp_ids.txt

      - name: The inositol benchmark's entries
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$IP_BENCHMARK_RUN" --repo "$GITHUB_REPOSITORY" --name benchmark-dataset --dir data/ipbench
          python - <<'PY'
          import pandas as pd
          t = pd.read_csv("data/transfer/entries.csv"); t["source"] = "transfer"
          ip = pd.read_csv("data/ipbench/entries.csv"); ip["source"] = "inositol"
          overlap = set(t["pdb_id"].str.upper()) & set(ip["pdb_id"].str.upper())
          assert not overlap, f"entries in both datasets: {sorted(overlap)[:10]}"
          pd.concat([t, ip], ignore_index=True).to_csv("data/transfer/joint_entries.csv", index=False)
          print(len(t), "transfer +", len(ip), "inositol entries")
          PY

      - name: Cache structures
        uses: actions/cache@v5
        with:
          path: data/transfer/structures
          key: transfer-structures-${{ hashFiles('data/transfer/joint_entries.csv') }}

      - name: Download structures
        shell: bash -l {0}
        run: |
          python scripts/fetch_structures.py rcsb --out data/transfer/structures \
            --ids-csv data/transfer/joint_entries.csv --column pdb_id \
            --manifest data/transfer/download_manifest.json

      - name: Joint homology groups
        shell: bash -l {0}
        run: |
          python scripts/homology_groups.py \
            --entry-csv data/transfer/joint_entries.csv \
            --structures-dir data/transfer/structures \
            --output-csv data/transfer/joint_grouped.csv \
            --report-json data/transfer/homology_report.json \
            --work-dir /tmp/homology --threads "$(nproc)"
          python - <<'PY'
          import pandas as pd
          j = pd.read_csv("data/transfer/joint_grouped.csv")
          j[j["source"] == "transfer"].to_csv("data/transfer/entries_grouped.csv", index=False)
          shared = set(j.loc[j.source == "transfer", "homology_group_strict"]) & set(j.loc[j.source == "inositol", "homology_group_strict"])
          print(len(shared), "strict groups hold entries of both datasets")
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: transfer-dataset
          path: |
            data/transfer/entries.csv
            data/transfer/entries_grouped.csv
            data/transfer/joint_entries.csv
            data/transfer/joint_grouped.csv
            data/transfer/comp_ids.txt
            data/transfer/manifest.json
            data/transfer/homology_report.json
            data/transfer/download_manifest.json
          retention-days: 90

  extract:
    name: Extract ${{ matrix.shard }}
    needs: [plan, dataset]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          run-post: 'false'
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,bioconda

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge fpocket pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - uses: actions/download-artifact@v7
        with:
          name: transfer-dataset
          path: data/transfer

      - name: Restore structures
        uses: actions/cache/restore@v5
        with:
          path: data/transfer/structures
          key: transfer-structures-${{ hashFiles('data/transfer/joint_entries.csv') }}

      - name: Fetch anything the cache lacks
        shell: bash -l {0}
        run: |
          python scripts/fetch_structures.py rcsb --out data/transfer/structures \
            --ids-csv data/transfer/entries.csv --column pdb_id

      - name: Extract pockets, descriptors and labels
        shell: bash -l {0}
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          import pandas as pd
          ids = pd.read_csv("data/transfer/entries.csv")["pdb_id"].str.upper()
          open("data/transfer/transfer_ids.txt", "w").write("\n".join(ids) + "\n")
          PY
          python scripts/extract_pocket_features.py \
            --structures-dir data/transfer/structures \
            --entry-csv data/transfer/entries_grouped.csv \
            --ids-file data/transfer/transfer_ids.txt \
            --comp-ids $(cat data/transfer/comp_ids.txt) \
            --output-csv results/transfer/pockets/pockets_${{ matrix.shard }}.csv \
            --cache-dir /tmp/feature_cache \
            --summary-json results/transfer/pockets/summary_${{ matrix.shard }}.json \
            --max-protein-atoms 99999 --fpocket-timeout 2700 \
            --shard-index ${{ matrix.shard }} --shard-count ${{ strategy.job-total }} \
            --sasa-points 256 --jobs "$(nproc)"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: transfer-pockets-${{ matrix.shard }}
          path: results/transfer/pockets
          retention-days: 30

  prepare:
    name: Prepare
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: transfer-dataset
          path: data/transfer
      - uses: actions/download-artifact@v7
        with:
          pattern: transfer-pockets-*
          path: results/transfer/pockets
          merge-multiple: true
      - name: Merge shards and build the table
        run: |
          python - <<'PY'
          import glob, json
          import pandas as pd
          parts = [pd.read_csv(p, low_memory=False) for p in sorted(glob.glob("results/transfer/pockets/pockets_*.csv"))]
          parts = [p for p in parts if len(p)]
          if not parts:
              raise SystemExit("no shard produced pockets")
          pd.concat(parts, ignore_index=True).to_csv("results/transfer/pockets_all.csv.gz", index=False)
          structures = pd.concat([pd.read_csv(p) for p in sorted(glob.glob("results/transfer/pockets/summary_*_structures.csv"))], ignore_index=True)
          structures.to_csv("results/transfer/structures.csv", index=False)
          accounting = {
              "structures": int(len(structures)),
              "with_pockets": int(pd.concat(parts)["structure_id"].nunique()),
              "failed": int(structures["error"].notna().sum()) if "error" in structures else 0,
              "excluded": int(structures["excluded"].notna().sum()) if "excluded" in structures else 0,
          }
          json.dump(accounting, open("results/transfer/extraction_accounting.json", "w"), indent=2)
          print(json.dumps(accounting, indent=2))
          PY
          python scripts/benchmark.py prepare \
            --pockets-csv results/transfer/pockets_all.csv.gz \
            --entry-csv data/transfer/entries_grouped.csv \
            --output results/transfer/table.csv.gz \
            --summary-json results/transfer/prepare_summary.json
          cat results/transfer/prepare_summary.json
      - uses: actions/upload-artifact@v6
        with:
          name: transfer-table
          path: |
            results/transfer/table.csv.gz
            results/transfer/prepare_summary.json
            results/transfer/extraction_accounting.json
            results/transfer/structures.csv
          retention-days: 90

  evaluate:
    name: ${{ matrix.task }} ${{ matrix.arm }} ${{ matrix.grouping }} r${{ matrix.repeat }}${{ matrix.permute && ' permuted' || '' }}
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: transfer-table
          path: results/transfer
      - name: Evaluate
        run: |
          flags=()
          if [ "${{ matrix.holdout }}" = "true" ]; then flags+=(--holdout); fi
          if [ "${{ matrix.permute }}" = "true" ]; then flags+=(--permute); fi
          python scripts/benchmark.py run --table results/transfer/table.csv.gz \
            --task ${{ matrix.task }} --arm ${{ matrix.arm }} --grouping ${{ matrix.grouping }} \
            --repeat ${{ matrix.repeat }} --n-draws 10 \
            --out-dir results/transfer/predictions "${flags[@]}"
      - uses: actions/upload-artifact@v6
        with:
          # The comparison reads non-permuted runs and permutation r0, as the
          # benchmark does; the other permutations feed only the null.
          name: ${{ (matrix.permute && matrix.repeat > 0) && 'transfer-null' || 'transfer-predictions' }}-${{ matrix.task }}-${{ matrix.arm }}-${{ matrix.grouping }}-${{ matrix.repeat }}-${{ matrix.permute }}
          path: results/transfer/predictions
          retention-days: 90

  compare:
    name: Compare, null and decisions
    needs: evaluate
    if: ${{ !cancelled() && needs.evaluate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: transfer-table
          path: results/transfer
      - uses: actions/download-artifact@v7
        with:
          pattern: transfer-predictions-*
          path: results/transfer/predictions
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: transfer-predictions-*-true
          path: results/transfer/null
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: transfer-null-*
          path: results/transfer/null
          merge-multiple: true
      - name: Compare
        run: |
          python scripts/benchmark.py compare \
            --predictions-dir results/transfer/predictions \
            --prepare-summary results/transfer/prepare_summary.json \
            --out-dir results/transfer/report
          python scripts/permutation_null.py --predictions-dir results/transfer/null \
            --output results/transfer/report/permutation_null.json
          python scripts/transfer.py decide --report results/transfer/report/benchmark_report.json \
            --null results/transfer/report/permutation_null.json \
            --output results/transfer/report/transfer_decisions.json
          echo "BEGIN_REPORT_JSON"
          python -c "import json; print(json.dumps(json.load(open('results/transfer/report/benchmark_report.json')), separators=(',', ':')))"
          echo "END_REPORT_JSON"
          cat results/transfer/report/REPORT.md results/transfer/report/permutation_null.md \
            results/transfer/report/transfer_decisions.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: transfer-report
          path: results/transfer/report
          retention-days: 90

  external:
    name: T3 external test
    needs: [dataset, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: transfer-table
          path: results/transfer
      - uses: actions/download-artifact@v7
        with:
          name: transfer-dataset
          path: data/transfer
      - name: The inositol benchmark's table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$IP_BENCHMARK_RUN" --repo "$GITHUB_REPOSITORY" --name benchmark-table --dir ipbench
          sha256sum ipbench/table.csv.gz
      - name: External test
        run: |
          python scripts/transfer.py external --transfer-table results/transfer/table.csv.gz \
            --ip-table ipbench/table.csv.gz --joint-entries data/transfer/joint_grouped.csv \
            --output results/transfer/external/external.json
          cat results/transfer/external/external.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: transfer-external
          path: results/transfer/external
          retention-days: 90
