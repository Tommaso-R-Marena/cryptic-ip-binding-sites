name: Within-protein control

# docs/WITHIN_PROTEIN_PLAN.md (study Q8).
#
# The architecture line's real-lining comparison sets 75 candidate pocket
# linings against random position sets matched on size and span, and says
# plainly that the comparison is nearly tautological: a random position set is
# not a protein. The control that would mean something is other pockets from
# the same proteins, and no committed table carries residue lists for them -
# checked, not assumed.
#
# So this workflow builds that control. Two jobs, and only the first needs the
# network:
#
#   pockets   fetches the 75 AlphaFold models and re-detects EVERY pocket in
#             each, keeping each pocket's lining residues. Needs fpocket.
#   analyse   re-identifies the candidate by overlap, matches siblings on
#             lining size, and scores the candidate's quantile among them. A
#             pure function of two tables, so it needs no network at all.

on:
  push:
    # An analysis, not a test: on main it runs on demand only.
    branches-ignore:
      - main
    paths:
      - 'docs/WITHIN_PROTEIN_PLAN.md'
      - 'scripts/within_protein.py'
      - 'cryptic_ip/detect/architecture.py'
      - '.github/workflows/within-protein.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Re-detect at most this many proteins (0 = all)'
        default: '0'
      null_draws:
        description: 'permutation draws per architecture null'
        default: '800'

concurrency:
  group: within-protein-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NULL_DRAWS: ${{ inputs.null_draws || '800' }}
  LIMIT: ${{ inputs.limit || '0' }}

jobs:
  pockets:
    name: Re-detect every pocket in the candidate proteins
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          run-post: 'false'
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,bioconda,defaults
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge fpocket freesasa pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Cache the AlphaFold models
        uses: actions/cache@v5
        with:
          path: structures/alphafold
          key: within-protein-models-v1
      - name: Re-detect pockets, keeping every lining
        shell: bash -l {0}
        run: |
          python scripts/within_protein.py pockets \
            --table results/specificity/candidates.csv \
            --cache-dir structures/alphafold \
            --limit "$LIMIT" \
            --out pockets.csv --report pockets_report.json
      - name: Print the pocket table
        shell: bash -l {0}
        run: |
          python scripts/extract_log_block.py emit Q8_POCKETS_B64 pockets.csv
          python scripts/extract_log_block.py emit Q8_POCKETS_REPORT_JSON pockets_report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: within-protein-pockets
          path: |
            pockets.csv
            pockets_report.json
          retention-days: 90

  analyse:
    name: Candidate against its own protein's pockets
    needs: [pockets]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: within-protein-pockets
          path: parts
      - name: Run study Q8
        run: |
          python scripts/within_protein.py analyse \
            --pockets parts/pockets.csv \
            --table results/specificity/candidates.csv \
            --draws "$NULL_DRAWS" \
            --out within_protein.json --markdown WITHIN_PROTEIN.md
      - name: Print the results
        run: |
          python scripts/extract_log_block.py emit WITHIN_PROTEIN_MD_B64 WITHIN_PROTEIN.md
          python scripts/extract_log_block.py emit WITHIN_PROTEIN_JSON_B64 within_protein.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: within-protein-results
          path: |
            within_protein.json
            WITHIN_PROTEIN.md
          retention-days: 90
