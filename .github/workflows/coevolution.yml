name: Coevolution

# docs/COEVOLUTION_PLAN.md: Dictyostelium holds roughly ten times the IP6 of human
# or yeast, and far more IP7 and IP8. If protein architecture co-evolved with
# inositol-phosphate availability, it should bury more of them. Every earlier
# study took candidates as a rank cutoff per organism, which fixes the count by
# construction; a rate needs one absolute threshold applied to all three proteomes.
#
#   table    proteins, sequences, the rule-only score, and the matching covariates
#   report   C1-C5; printed between markers
#
# The primary test is the matched comparison, not the raw one: model confidence,
# protein length and amino-acid composition all differ between these proteomes.
# The report code is deliberately not a trigger: a report-only fix is dispatched
# with table_run, which reuses that run's table.

on:
  push:
    # Analyses, not tests: on main they run on demand only.
    branches-ignore:
      - main
    paths:
      - 'docs/COEVOLUTION_PLAN.md'
      - 'scripts/coevolution.py'
      - '.github/workflows/coevolution.yml'
  workflow_dispatch:
    inputs:
      specificity_run:
        description: 'specificity run holding proteins_combined.csv.gz (the specificity-rerank artifact)'
        default: '36020458866'
      screen_run:
        description: 'proteome screen run holding the pocket shards (for the rule-only arm)'
        default: '35935291031'
      table_run:
        description: 'reuse the table of this coevolution run (empty = build it)'
        default: ''

concurrency:
  group: coevolution-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  SPECIFICITY_RUN: ${{ inputs.specificity_run || '36020458866' }}
  SCREEN_RUN: ${{ inputs.screen_run || '35935291031' }}

jobs:
  table:
    name: Table
    if: ${{ !inputs.table_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Study C's scored proteins and the screen's pocket shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$SPECIFICITY_RUN" --repo "$GITHUB_REPOSITORY" --name specificity-rerank --dir screen
          gh run download "$SCREEN_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'shard-*' --dir shards
          find screen -name 'proteins_combined.csv.gz' | head -1
          find shards -name '*_pockets_part*.csv.gz' | wc -l
      - name: Sequences for length and composition
        run: |
          python scripts/learned_screen.py fasta \
            --accessions-csv "$(find screen -name 'proteins_combined.csv.gz' | head -1)" \
            --columns uniprot_id --output seq/screened.fasta
          grep -c '^>' seq/screened.fasta
      - name: Build the analysis table
        run: |
          python scripts/coevolution.py table \
            --proteins "$(find screen -name 'proteins_combined.csv.gz' | head -1)" \
            --shards-dir shards --fasta seq/screened.fasta --out coev_table.csv.gz
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coevolution-table
          path: coev_table.csv.gz
          retention-days: 90

  report:
    name: Report
    needs: table
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: The table of this run, or of the run being reused
        env:
          GH_TOKEN: ${{ github.token }}
          TABLE_RUN: ${{ inputs.table_run || github.run_id }}
        run: gh run download "$TABLE_RUN" --repo "$GITHUB_REPOSITORY" --name coevolution-table --dir tbl
      - name: Report
        run: |
          python scripts/coevolution.py report --table tbl/coev_table.csv.gz --out-dir results/coevolution
          cat results/coevolution/COEVOLUTION.md >> "$GITHUB_STEP_SUMMARY"
          python scripts/extract_log_block.py emit COEVOLUTION_JSON results/coevolution/coevolution.json
          python scripts/extract_log_block.py emit COEVOLUTION_MD_B64 results/coevolution/COEVOLUTION.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coevolution-report
          path: results/coevolution
          retention-days: 90
