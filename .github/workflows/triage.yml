name: Triage

# docs/TRIAGE_PLAN.md: the screen ranks a pocket from one AlphaFold model and never
# asks whether that pocket is conserved. This applies study B's conservation
# criterion, unchanged, to every candidate of study C, against pLDDT- and
# depth-matched controls and with annotated binders as the filter's calibration.
#
#   conserve   UniRef50 homologues + MAFFT + the criterion, for candidates,
#              positive controls and matched negative controls
#   report     H1-H3; printed between markers
#
# The report code is deliberately not a trigger: a report-only fix is dispatched
# with conserve_run, which reuses that run's alignments.

on:
  push:
    # Analyses, not tests: on main they run on demand only.
    branches-ignore:
      - main
    paths:
      - 'docs/TRIAGE_PLAN.md'
      - 'scripts/triage.py'
      - '.github/workflows/triage.yml'
  workflow_dispatch:
    inputs:
      specificity_run:
        description: 'specificity run holding proteins_combined.csv.gz (the specificity-rerank artifact)'
        default: '36020458866'
      conserve_run:
        description: 'reuse the conservation of this triage run (empty = compute it)'
        default: ''

concurrency:
  group: triage-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  SPECIFICITY_RUN: ${{ inputs.specificity_run || '36020458866' }}

jobs:
  conserve:
    name: Conservation
    if: ${{ !inputs.conserve_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          run-post: 'false'
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,bioconda
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c bioconda -c conda-forge mafft=7.526
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          which mafft
      - name: Study C's scored proteins, which carry the matching columns
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$SPECIFICITY_RUN" --repo "$GITHUB_REPOSITORY" --name specificity-rerank --dir screen
          find screen -name 'proteins_combined.csv.gz' | head -1
      - name: Conservation of every candidate, positive and matched control
        shell: bash -l {0}
        run: |
          python scripts/triage.py conserve --candidates results/specificity/candidates.csv \
            --proteins "$(find screen -name 'proteins_combined.csv.gz' | head -1)" \
            --out-dir work --out conservation.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: triage-conservation
          path: conservation.json
          retention-days: 90

  report:
    name: Report
    needs: conserve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: The conservation of this run, or of the run being reused
        env:
          GH_TOKEN: ${{ github.token }}
          CONSERVE_RUN: ${{ inputs.conserve_run || github.run_id }}
        run: gh run download "$CONSERVE_RUN" --repo "$GITHUB_REPOSITORY" --name triage-conservation --dir cons
      - name: Report
        run: |
          python scripts/triage.py report --candidates results/specificity/candidates.csv \
            --conservation cons/conservation.json --out-dir results/triage
          cat results/triage/TRIAGE.md >> "$GITHUB_STEP_SUMMARY"
          python scripts/extract_log_block.py emit TRIAGE_JSON results/triage/triage.json
          python scripts/extract_log_block.py emit TRIAGE_MD_B64 results/triage/TRIAGE.md
          python scripts/extract_log_block.py emit TRIAGE_CANDIDATES_B64 results/triage/triaged_candidates.csv
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: triage-report
          path: results/triage
          retention-days: 90
