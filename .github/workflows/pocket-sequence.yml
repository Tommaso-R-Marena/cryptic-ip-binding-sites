name: Sequence and pockets

# docs/POCKET_SEQUENCE_PLAN.md (study Q9).
#
# Does the sequence predict that a pocket forms, what kind it is, or what it
# binds? Every primary test is on composition_z - a window's statistic against
# shuffles of its own letters - so a difference is a difference in arrangement
# and not in composition.
#
# Three jobs:
#
#   pockets    re-detects every pocket in the 75 candidate models, exactly as
#              the within-protein workflow does. Needs fpocket.
#   sequences  reads the chain sequences out of the same structure files and
#              runs no detection at all, so it is minutes.
#   analyse    the three arms. A pure function of the two tables above.

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'docs/POCKET_SEQUENCE_PLAN.md'
      - 'scripts/pocket_sequence.py'
      - 'cryptic_ip/detect/sequence.py'
      - '.github/workflows/pocket-sequence.yml'
  workflow_dispatch:
    inputs:
      shuffles:
        description: 'shuffles per window for the order null'
        default: '2000'
      limit:
        description: 'at most this many proteins (0 = all)'
        default: '0'

concurrency:
  group: pocket-sequence-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHUFFLES: ${{ inputs.shuffles || '2000' }}
  LIMIT: ${{ inputs.limit || '0' }}

jobs:
  pockets:
    name: Pockets and sequences of the candidate proteins
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          run-post: 'false'
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,bioconda,defaults
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge fpocket freesasa pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Cache the AlphaFold models
        uses: actions/cache@v5
        with:
          path: structures/alphafold
          key: within-protein-models-v1
      - name: Re-detect every pocket
        shell: bash -l {0}
        run: |
          python scripts/within_protein.py pockets \
            --table results/specificity/candidates.csv \
            --cache-dir structures/alphafold \
            --limit "$LIMIT" \
            --out pockets.csv --report pockets_report.json
      - name: Read the sequences out of the same files
        shell: bash -l {0}
        run: |
          python scripts/pocket_sequence.py sequences \
            --structures structures/alphafold --out sequences.csv
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pocket-sequence-inputs
          path: |
            pockets.csv
            sequences.csv
            pockets_report.json
          retention-days: 90

  analyse:
    name: Formation, type and function
    needs: [pockets]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: pocket-sequence-inputs
          path: parts
      - name: Run study Q9
        run: |
          python scripts/pocket_sequence.py analyse \
            --sequences parts/sequences.csv \
            --pockets parts/pockets.csv \
            --shuffles "$SHUFFLES" \
            --out pocket_sequence.json --markdown POCKET_SEQUENCE.md
      - name: Print the results
        run: |
          python scripts/extract_log_block.py emit Q9_MD_B64 POCKET_SEQUENCE.md
          python scripts/extract_log_block.py emit Q9_JSON_B64 pocket_sequence.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pocket-sequence-results
          path: |
            pocket_sequence.json
            POCKET_SEQUENCE.md
          retention-days: 90
