name: Benchmark

# The pre-registered benchmark (docs/ANALYSIS_PLAN.md), end to end:
#
#   dataset    every PDB entry holding an inositol phosphate (X-ray or EM, 3.5 A
#              or better), its structures, and its homology groups - MMseqs2
#              sequence links and Foldseek structural links over every chain
#   extract    pockets, descriptors (ligand-free) and labels, in 40 shards so
#              that no shard nears the 6-hour job limit; fpocket may take 45 min
#   prepare    one table: each task's labels, both groupings, the temporal
#              holdout, the rule-based score
#   evaluate   one job per task x descriptor arm x grouping x repeat, plus the
#              permutation controls; paired arms share every seed
#   compare    intervals, paired ablations and the plan's decisions
#
# MODE=full, the default, is the pre-registered analysis. MODE=smoke (on
# demand) runs a seeded sample of 60 entries with every label permuted: it
# exercises the whole pipeline and cannot reveal anything about the hypotheses.

on:
  push:
    paths:
      - 'scripts/benchmark.py'
      - 'scripts/homology_groups.py'
      - 'cryptic_ip/benchmark/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke or full'
        default: 'full'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  MODE: ${{ inputs.mode || 'full' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      runs: ${{ steps.plan.outputs.runs }}
      max_entries: ${{ steps.plan.outputs.max_entries }}
      draws: ${{ steps.plan.outputs.draws }}
    steps:
      - id: plan
        shell: python
        run: |
          import json, os
          smoke = os.environ["MODE"] == "smoke"
          n_shards = 4 if smoke else 40
          tasks = ["ip_site", "cryptic_ip_site", "burial"]
          runs = []
          for task in tasks:
              for arm in ["full", "no_hull_depth"]:
                  repeats = [0] if smoke else [0, 1, 2]
                  for r in repeats:
                      runs.append({"task": task, "arm": arm, "grouping": "sequence", "repeat": r,
                                   "holdout": r == 0, "permute": smoke})
                  runs.append({"task": task, "arm": arm, "grouping": "strict", "repeat": 0,
                               "holdout": False, "permute": smoke})
              if not smoke:
                  runs.append({"task": task, "arm": "full", "grouping": "sequence", "repeat": 0,
                               "holdout": False, "permute": True})
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"shards={json.dumps(list(range(n_shards)))}\n")
              fh.write(f"runs={json.dumps({'include': runs})}\n")
              fh.write(f"max_entries={60 if smoke else 0}\n")
              fh.write(f"draws={2 if smoke else 10}\n")
          print(json.dumps({"mode": os.environ["MODE"], "shards": n_shards, "runs": len(runs)}))

  dataset:
    name: Dataset and homology groups
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          run-post: 'false'
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,bioconda

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge -c bioconda mmseqs2 foldseek pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          mmseqs version && foldseek version

      - name: Find every inositol phosphate complex
        shell: bash -l {0}
        run: |
          limit=()
          if [ "${{ needs.plan.outputs.max_entries }}" != "0" ]; then limit=(--sample-entries "${{ needs.plan.outputs.max_entries }}"); fi
          python scripts/build_ip_validation_dataset.py --metadata-only \
            --experimental-methods "X-RAY DIFFRACTION" "ELECTRON MICROSCOPY" \
            --max-resolution 3.5 "${limit[@]}" \
            --entry-csv data/benchmark/entries.csv \
            --manifest data/benchmark/dataset_manifest.json \
            --download-dir data/benchmark/raw
          python -c "import pandas as pd; t = pd.read_csv('data/benchmark/entries.csv'); print(len(t), 'entries')"

      - name: Cache structures
        uses: actions/cache@v5
        with:
          path: data/benchmark/structures
          key: benchmark-structures-${{ hashFiles('data/benchmark/entries.csv') }}

      - name: Download structures
        shell: bash -l {0}
        run: |
          python scripts/fetch_structures.py rcsb --out data/benchmark/structures \
            --ids-csv data/benchmark/entries.csv --column pdb_id \
            --manifest data/benchmark/download_manifest.json

      - name: Homology groups
        shell: bash -l {0}
        run: |
          python scripts/homology_groups.py \
            --entry-csv data/benchmark/entries.csv \
            --structures-dir data/benchmark/structures \
            --output-csv data/benchmark/entries_grouped.csv \
            --report-json data/benchmark/homology_report.json \
            --work-dir /tmp/homology --threads "$(nproc)"
          cat data/benchmark/homology_report.json

      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-dataset
          path: |
            data/benchmark/entries.csv
            data/benchmark/entries_grouped.csv
            data/benchmark/homology_report.json
            data/benchmark/dataset_manifest.json
            data/benchmark/download_manifest.json
          retention-days: 90

  extract:
    name: Extract ${{ matrix.shard }}
    needs: [plan, dataset]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          run-post: 'false'
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,bioconda

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge fpocket pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - uses: actions/download-artifact@v7
        with:
          name: benchmark-dataset
          path: data/benchmark

      - name: Restore structures
        uses: actions/cache/restore@v5
        with:
          path: data/benchmark/structures
          key: benchmark-structures-${{ hashFiles('data/benchmark/entries.csv') }}

      - name: Fetch anything the cache lacks
        shell: bash -l {0}
        run: |
          python scripts/fetch_structures.py rcsb --out data/benchmark/structures \
            --ids-csv data/benchmark/entries.csv --column pdb_id

      - name: Extract pockets, descriptors and labels
        shell: bash -l {0}
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/extract_pocket_features.py \
            --structures-dir data/benchmark/structures \
            --entry-csv data/benchmark/entries_grouped.csv \
            --output-csv results/benchmark/pockets/pockets_${{ matrix.shard }}.csv \
            --cache-dir /tmp/feature_cache \
            --summary-json results/benchmark/pockets/summary_${{ matrix.shard }}.json \
            --max-protein-atoms 99999 --fpocket-timeout 2700 \
            --shard-index ${{ matrix.shard }} --shard-count ${{ strategy.job-total }} \
            --sasa-points 256 --jobs "$(nproc)"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmark-pockets-${{ matrix.shard }}
          path: results/benchmark/pockets
          retention-days: 30

  prepare:
    name: Prepare
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - uses: actions/download-artifact@v7
        with:
          name: benchmark-dataset
          path: data/benchmark

      - uses: actions/download-artifact@v7
        with:
          pattern: benchmark-pockets-*
          path: results/benchmark/pockets
          merge-multiple: true

      - name: Merge shards and build the table
        run: |
          python - <<'PY'
          import glob, json
          import pandas as pd
          parts = [pd.read_csv(p, low_memory=False) for p in sorted(glob.glob("results/benchmark/pockets/pockets_*.csv"))]
          parts = [p for p in parts if len(p)]
          if not parts:
              raise SystemExit("no shard produced pockets; see the extract jobs' accounting lines")
          pockets = pd.concat(parts, ignore_index=True)
          pockets.to_csv("results/benchmark/pockets_all.csv.gz", index=False)
          structures = pd.concat(
              [pd.read_csv(p) for p in sorted(glob.glob("results/benchmark/pockets/summary_*_structures.csv"))],
              ignore_index=True,
          )
          structures.to_csv("results/benchmark/structures.csv", index=False)
          accounting = {
              "structures": int(len(structures)),
              "with_pockets": int(pockets["structure_id"].nunique()),
              "failed": int(structures["error"].notna().sum()) if "error" in structures else 0,
              "excluded": int(structures["excluded"].notna().sum()) if "excluded" in structures else 0,
          }
          json.dump(accounting, open("results/benchmark/extraction_accounting.json", "w"), indent=2)
          print(json.dumps(accounting, indent=2))
          PY
          python scripts/benchmark.py prepare \
            --pockets-csv results/benchmark/pockets_all.csv.gz \
            --entry-csv data/benchmark/entries_grouped.csv \
            --output results/benchmark/table.csv.gz \
            --summary-json results/benchmark/prepare_summary.json

      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-table
          path: |
            results/benchmark/table.csv.gz
            results/benchmark/prepare_summary.json
            results/benchmark/extraction_accounting.json
            results/benchmark/structures.csv
          retention-days: 90

  evaluate:
    name: ${{ matrix.task }} ${{ matrix.arm }} ${{ matrix.grouping }} r${{ matrix.repeat }}${{ matrix.permute && ' permuted' || '' }}
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - uses: actions/download-artifact@v7
        with:
          name: benchmark-table
          path: results/benchmark

      - name: Evaluate
        run: |
          flags=()
          if [ "${{ matrix.holdout }}" = "true" ]; then flags+=(--holdout); fi
          if [ "${{ matrix.permute }}" = "true" ]; then flags+=(--permute); fi
          python scripts/benchmark.py run --table results/benchmark/table.csv.gz \
            --task ${{ matrix.task }} --arm ${{ matrix.arm }} --grouping ${{ matrix.grouping }} \
            --repeat ${{ matrix.repeat }} --n-draws ${{ needs.plan.outputs.draws }} \
            --out-dir results/benchmark/predictions "${flags[@]}"

      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-predictions-${{ matrix.task }}-${{ matrix.arm }}-${{ matrix.grouping }}-${{ matrix.repeat }}-${{ matrix.permute }}
          path: results/benchmark/predictions
          retention-days: 90

  compare:
    name: Compare
    needs: evaluate
    # Compare whatever evaluations finished, but not when none ran (an upstream
    # step failed): there is nothing to compare then.
    if: ${{ !cancelled() && needs.evaluate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - uses: actions/download-artifact@v7
        with:
          name: benchmark-table
          path: results/benchmark

      - uses: actions/download-artifact@v7
        with:
          pattern: benchmark-predictions-*
          path: results/benchmark/predictions
          merge-multiple: true

      - name: Compare
        run: |
          smoke=()
          if [ "$MODE" = "smoke" ]; then smoke=(--smoke); fi
          python scripts/benchmark.py compare \
            --predictions-dir results/benchmark/predictions \
            --prepare-summary results/benchmark/prepare_summary.json \
            --out-dir results/benchmark/report "${smoke[@]}"
          cat results/benchmark/report/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmark-report
          path: results/benchmark/report
          retention-days: 90
