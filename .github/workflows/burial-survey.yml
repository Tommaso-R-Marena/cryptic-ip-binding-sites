name: Burial Survey

# Population-level calibration study, not a gate. The burial boundary defines
# the positive class, and calibrating it on five hand-picked controls can show
# that a gap exists but not where in that gap the boundary belongs. This job
# re-measures every deposited inositol phosphate complex in the bundled dataset
# with the per-copy definition and reports the distribution.
#
# It runs only when its own inputs change, on demand, or monthly - never on
# every commit: it downloads and measures well over a hundred structures, which
# is far too slow for a per-commit check.

on:
  # Re-run when the measurement, the entries being measured, or the boundary
  # under test changes - those are exactly the events that can invalidate a
  # published distribution. Not on every commit: this measures well over a
  # hundred structures.
  push:
    # Analyses, not tests: on main they run on demand only, so merging
    # does not re-derive every recorded result.
    branches-ignore:
      - main
    paths:
      - 'scripts/burial_survey.py'
      - 'cryptic_ip/validation/burial_metrics.py'
      - 'cryptic_ip/analysis/inositol_detection.py'
      - 'cryptic_ip/analysis/structure_arrays.py'
      - 'data/validation/ip_binding_validation_dataset.csv'
      - '.github/workflows/burial-survey.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Survey at most this many entries (0 = all)'
        required: false
        default: '0'
      sasa_points:
        description: 'SASA sample points per atom'
        required: false
        default: '128'
  schedule:
    - cron: '0 5 1 * *'

jobs:
  survey:
    name: Per-copy relative burial survey
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          # The post-job package cleanup prints a line per package - well over a
          # hundred - which buries the diagnostic output these jobs exist to
          # produce. The runner is discarded either way.
          run-post: 'false'
          auto-update-conda: true
          python-version: '3.11'
          channels: conda-forge,bioconda,defaults

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge fpocket freesasa pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Cache survey structures
        uses: actions/cache@v5
        with:
          path: data/validation/raw/structures
          key: burial-survey-structures-v1

      - name: Download dataset structures
        shell: bash -l {0}
        # Concurrent, retried, validated and written atomically; legacy PDB
        # preferred (the format every entry here has), mmCIF when an entry has
        # none. An entry that cannot be fetched is reported in the manifest and
        # the run continues: the analysis reports on what it could measure.
        run: |
          python scripts/fetch_structures.py rcsb \
            --out data/validation/raw/structures \
            --ids-csv data/validation/ip_binding_validation_dataset.csv --column pdb_id

      - name: Run the survey
        shell: bash -l {0}
        run: |
          python scripts/burial_survey.py \
            --structures-dir data/validation/raw/structures \
            --entry-csv data/validation/ip_binding_validation_dataset.csv \
            --output-json results/calibration/burial_survey.json \
            --output-csv results/calibration/burial_survey.csv \
            --sasa-points "${{ github.event.inputs.sasa_points || '128' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --jobs 4

      - name: Upload survey results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: burial-survey
          path: results/calibration/burial_survey.*
          if-no-files-found: warn

      - name: Survey digest
        shell: bash -l {0}
        # Runs last so the distribution and the candidate boundaries stay
        # reachable from a short log tail, and lands in the run summary.
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("results/calibration/burial_survey.json")
          if not path.exists():
              print("no survey output was produced")
              raise SystemExit(0)

          summary = json.loads(path.read_text())["summary"]
          print("## Per-copy relative burial survey\n")
          print(f"- entries with structures: **{summary['n_entries']}**")
          print(f"- measured: **{summary['n_measured']}**")
          print(f"- failed: **{summary['n_failed']}**")
          for reason, count in sorted(summary.get("failure_reasons", {}).items()):
              print(f"    - {count} x {reason}")

          stats = summary.get("relative_sasa")
          if not stats:
              raise SystemExit(0)

          print("\n### Distribution of relative SASA\n")
          print("| quantile | value |")
          print("| --- | --- |")
          for key, value in stats["quantiles"].items():
              print(f"| {key} | {value:.3f} |")

          candidates = summary["candidate_boundaries"]
          def show(value):
              return "none - no trough found" if value is None else f"{value:.3f}"

          print("\n### Candidate boundaries\n")
          print("| estimate | value |")
          print("| --- | --- |")
          print(f"| density minimum | {show(candidates['density_minimum'])} |")
          print(f"| Otsu | {show(candidates['otsu'])} |")
          print(f"| configured cryptic max | {candidates['configured_cryptic_max']:.3f} |")
          print(f"\n- bimodal by density: **{summary['is_bimodal_by_density']}**")
          print(f"- at or below the configured boundary: **{summary['n_below_configured_boundary']}**")
          print(f"- class counts: `{summary['class_counts']}`")
          print(f"- series counts: `{summary['series_counts']}`")

          sweep = summary.get("boundary_sweep") or []
          if sweep:
              print("\n### Positive class size vs boundary\n")
              print("| boundary | positives | fraction |")
              print("| --- | --- | --- |")
              for row in sweep:
                  print(
                      f"| {row['boundary']:.2f} | {row['n_positive']} "
                      f"| {row['fraction_positive']:.1%} |"
                  )

          disc = summary.get("discrimination") or {}
          measures = disc.get("measures") or {}
          if measures:
              print("\n### Does each descriptor track burial?\n")
              print(
                  "| descriptor | n | Spearman rho vs relSASA | AUROC buried vs exposed "
                  "| 95% CI | buried / exposed |"
              )
              print("| --- | --- | --- | --- | --- | --- |")
              for name, m in measures.items():
                  if "auroc_buried_vs_exposed" not in m:
                      print(f"| {name} | {m.get('n')} | - | {m.get('note', '-')} | - | - |")
                      continue
                  ci = m.get("auroc_ci95") or [float("nan"), float("nan")]
                  print(
                      f"| {name} | {m['n']} | {m['spearman_rho_vs_relative_sasa']:+.3f} "
                      f"| {m['auroc_buried_vs_exposed']:.3f} | {ci[0]:.3f}-{ci[1]:.3f} "
                      f"| {m['n_buried']} / {m['n_exposed']} |"
                  )
          PY
