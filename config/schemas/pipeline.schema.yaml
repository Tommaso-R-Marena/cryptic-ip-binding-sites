$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required: [pipeline, provenance, data_sources, archival]
properties:
  pipeline:
    type: object
    required: [score_threshold, seed, sort_columns, float_tolerance, output_precision_decimals]
    properties:
      score_threshold:
        type: number
        minimum: 0
        maximum: 1
      max_structures:
        type: [integer, 'null']
        minimum: 1
      seed:
        type: integer
        minimum: 0
      use_ml_model:
        type: boolean
      model_path:
        type: string
      sort_columns:
        type: array
        minItems: 1
        items:
          type: string
      float_tolerance:
        type: number
        exclusiveMinimum: 0
      output_precision_decimals:
        type: integer
        minimum: 1
  burial:
    type: object
    description: >-
      Ligand burial measurement. Thresholds apply to relative SASA, the fraction
      of the ligand's own surface still reachable by solvent, which is invariant
      to ligand size and copy number.
    properties:
      cryptic_relative_sasa_max:
        type: number
        minimum: 0
        maximum: 1
      semi_cryptic_relative_sasa_max:
        type: number
        minimum: 0
        maximum: 1
      exposed_atom_sasa:
        type: number
        minimum: 0
      min_contacts_for_site:
        type: integer
        minimum: 0
      contact_cutoff:
        type: number
        exclusiveMinimum: 0
      coordination_cutoff:
        type: number
        exclusiveMinimum: 0
      sasa_points_per_atom:
        type: integer
        minimum: 32
  labeling:
    type: object
    description: >-
      Pocket labelling from observed ligand positions. The band between the two
      overlap thresholds is excluded from training rather than called negative.
    properties:
      overlap_contact_distance:
        type: number
        exclusiveMinimum: 0
      positive_overlap:
        type: number
        minimum: 0
        maximum: 1
      negative_overlap:
        type: number
        minimum: 0
        maximum: 1
      require_cryptic:
        type: boolean
  model:
    type: object
    description: Nested, grouped cross-validation settings for model training.
    properties:
      group_column: {type: string}
      n_splits:
        type: integer
        minimum: 2
      inner_splits:
        type: integer
        minimum: 2
      n_search_iter:
        type: integer
        minimum: 1
      n_bootstrap:
        type: integer
        minimum: 0
      scoring: {type: string}
      threshold_objective:
        type: string
        enum: [mcc, f1, fbeta, youden]
      calibrate: {type: boolean}
      calibration_fraction:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
      candidates:
        type: array
        minItems: 1
        items: {type: string}
  data_acquisition:
    type: object
    description: Ground-truth collection from the RCSB PDB.
    properties:
      experimental_methods:
        type: [array, 'null']
        items: {type: string}
      max_resolution:
        type: [number, 'null']
        exclusiveMinimum: 0
      n_decoys:
        type: integer
        minimum: 0
      decoy_max_resolution:
        type: number
        exclusiveMinimum: 0
      include_unphosphorylated: {type: boolean}
      download_workers:
        type: integer
        minimum: 1
        maximum: 8
  provenance:
    type: object
    required: [log_inputs, log_outputs, include_software_versions, manifest_path]
    properties:
      log_inputs: {type: boolean}
      log_outputs: {type: boolean}
      include_software_versions: {type: boolean}
      manifest_path: {type: string}
  data_sources:
    type: object
    required: [alphafold_release_date, pdb_fetch_date]
    properties:
      alphafold_release_date:
        type: string
      pdb_fetch_date:
        type: string
  archival:
    type: object
    required: [bundle_dir, include_paths]
    properties:
      bundle_dir:
        type: string
      include_paths:
        type: array
        items:
          type: string
additionalProperties: false
